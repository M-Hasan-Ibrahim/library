name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pdfjs-dist requires Node >= 22.13
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Data source switch. Empty (variable not defined) = bundled JSON.
          # To read from D1, define the repository variable LIBRARY_API_URL
          # (Settings > Secrets and variables > Actions > Variables), e.g.
          # https://api.library.mh-ibrahim.com. The site falls back to JSON on errors.
          VITE_LIBRARY_API_URL: ${{ vars.LIBRARY_API_URL }}

      - name: Check build output
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/documents/gradient-descent-lecture-notes.pdf
          echo "CNAME: $(cat dist/CNAME)"

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
